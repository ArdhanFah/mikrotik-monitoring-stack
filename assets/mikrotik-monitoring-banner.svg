<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 620" role="img" aria-labelledby="title desc">
  <title id="title">MikroTik Monitoring Stack</title>
  <desc id="desc">ZeroTier connected MikroTik routers monitored by Prometheus and Grafana</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#101a32"/>
      <stop offset="0.56" stop-color="#162848"/>
      <stop offset="1" stop-color="#0d6a68"/>
    </linearGradient>
    <linearGradient id="glow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#56e0c0" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#56e0c0" stop-opacity=".9"/>
      <stop offset="1" stop-color="#56e0c0" stop-opacity="0"/>
    </linearGradient>
    <filter id="blur"><feGaussianBlur stdDeviation="32"/></filter>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#06101f" flood-opacity=".35"/></filter>
    <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse"><path d="M36 0H0V36" fill="none" stroke="#b5d6da" stroke-opacity=".08"/></pattern>
  </defs>
  <rect width="1600" height="620" fill="url(#bg)"/>
  <rect width="1600" height="620" fill="url(#grid)"/>
  <circle cx="1370" cy="90" r="260" fill="#4ce0bd" opacity=".17" filter="url(#blur)"/>
  <circle cx="1040" cy="570" r="250" fill="#6c7cff" opacity=".17" filter="url(#blur)"/>

  <g transform="translate(112 122)">
    <rect x="0" y="0" width="640" height="310" rx="28" fill="#101b31" fill-opacity=".68" stroke="#85e9d2" stroke-opacity=".35"/>
    <text x="48" y="76" fill="#69e4c4" font-family="Arial, sans-serif" font-size="18" font-weight="700" letter-spacing="3">NETWORK OBSERVABILITY</text>
    <text x="44" y="145" fill="#ffffff" font-family="Arial, sans-serif" font-size="58" font-weight="700">MikroTik</text>
    <text x="48" y="207" fill="#cfe9ed" font-family="Arial, sans-serif" font-size="42" font-weight="400">Monitoring Stack</text>
    <rect x="50" y="246" width="270" height="3" rx="2" fill="url(#glow)"/>
    <text x="48" y="284" fill="#a9c3d1" font-family="Arial, sans-serif" font-size="19">ZeroTier  /  Prometheus  /  Grafana</text>
  </g>

  <g transform="translate(865 105)" filter="url(#shadow)">
    <rect x="0" y="0" width="590" height="370" rx="34" fill="#f7fbfa" fill-opacity=".97"/>
    <text x="42" y="53" fill="#1b2a40" font-family="Arial, sans-serif" font-size="17" font-weight="700" letter-spacing="2">PRIVATE OVERLAY TELEMETRY</text>
    <path d="M82 125 C160 74 240 75 315 126 S468 178 510 112" fill="none" stroke="#4f75e8" stroke-width="4" stroke-dasharray="8 11"/>
    <path d="M82 125 C160 177 240 177 315 126 S468 75 510 112" fill="none" stroke="#52cdb1" stroke-width="4" stroke-dasharray="8 11"/>
    <g transform="translate(45 83)">
      <rect width="92" height="78" rx="16" fill="#e4f6f2" stroke="#39b69e" stroke-width="2"/>
      <path d="M23 36h46M30 28v25M62 28v25M22 53h48" fill="none" stroke="#168875" stroke-width="4" stroke-linecap="round"/>
      <text x="46" y="101" text-anchor="middle" fill="#1b2a40" font-family="Arial, sans-serif" font-size="14" font-weight="700">ROUTERS</text>
    </g>
    <g transform="translate(268 82)">
      <circle cx="48" cy="40" r="43" fill="#eaefff" stroke="#6577e8" stroke-width="2"/>
      <path d="M48 16v48M24 40h48M31 23l34 34M65 23L31 57" stroke="#5467d6" stroke-width="4" stroke-linecap="round"/>
      <text x="48" y="101" text-anchor="middle" fill="#1b2a40" font-family="Arial, sans-serif" font-size="14" font-weight="700">ZEROTIER</text>
    </g>
    <g transform="translate(451 83)">
      <rect width="92" height="78" rx="16" fill="#fff2da" stroke="#edb455" stroke-width="2"/>
      <path d="M20 56h52M25 50l13-18 12 11 16-23" fill="none" stroke="#d08c22" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="46" y="101" text-anchor="middle" fill="#1b2a40" font-family="Arial, sans-serif" font-size="14" font-weight="700">GRAFANA</text>
    </g>
    <rect x="44" y="228" width="502" height="1" fill="#dbe5e7"/>
    <text x="44" y="271" fill="#1b2a40" font-family="Arial, sans-serif" font-size="19" font-weight="700">Secure. Observable. Production-ready.</text>
    <text x="44" y="307" fill="#667889" font-family="Arial, sans-serif" font-size="17">SNMP metrics over an encrypted ZeroTier network</text>
    <rect x="44" y="330" width="198" height="8" rx="4" fill="#55ceb0"/>
    <rect x="252" y="330" width="138" height="8" rx="4" fill="#6577e8"/>
    <rect x="400" y="330" width="146" height="8" rx="4" fill="#edb455"/>
  </g>
  <text x="116" y="548" fill="#83aab9" font-family="Arial, sans-serif" font-size="15" letter-spacing="2">CONTAINERIZED NETWORK MONITORING FOR REMOTE SITES</text>
</svg>
