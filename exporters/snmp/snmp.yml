auths:
  mikrotik_v2:
    version: 2
    community: CHANGE_ME_snmp_community

modules:
  mikrotik:
    walk:
      - 1.3.6.1.2.1.1
      - 1.3.6.1.2.1.2
      - 1.3.6.1.2.1.4
      - 1.3.6.1.2.1.6
      - 1.3.6.1.2.1.25.1
    max_repetitions: 25
    retries: 2
    timeout: 5s
    auth: mikrotik_v2
    lookups:
      - source_indexes: [ifIndex]
        lookup: ifAlias
      - source_indexes: [ifIndex]
        lookup: ifName
